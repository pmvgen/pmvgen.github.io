[package]
name = "pmvgen"
version = "2.38.10"
edition = "2021"
description = "PMV Generator - native Rust rewrite of pmvgen.github.io"
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
tiny-skia = "0.11"
ttf-parser = "0.25"
cpal = "0.15"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rand = "0.8"
dirs = "5"
anyhow = "1"
tract-onnx = "0.23"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[profile.dev]
opt-level = 2
